[General]
; Escribe 1 para crear DeFlawless.log o 0 para desactivar el log.
; Valores permitidos: 0 o 1.
Logging=1

[Display]
; Escribe 1 para activar la correccion FOV o 0 para desactivarla.
; Valores permitidos: 0 o 1.
Enabled=1
; FOV adicional en grados. Puede ser negativo.
; Rango permitido: -30.0 a 30.0.
AdditionalFOV=0.0
; Relacion de aspecto original del juego. 16:9 = 1.777777791.
; Rango permitido: 0.5 a 4.0.
DefaultAspectRatio=1.777777791
; Limite superior del FOV corregido, en grados.
; Rango permitido: 30.0 a 110.0.
FOVMax=110.0

[Debug]
; Solo diagnostico. 1 instala el hook sin cambiar el FOV.
; Valores permitidos: 0 o 1. Debe permanecer en 0 para uso normal.
Passthrough=0
